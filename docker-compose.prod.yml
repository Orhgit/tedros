name: tedros

# Production stack — postgres + redis + tedros (Node SSR).
# App port bound to 127.0.0.1:3001 (3000 taken by merkaz-haneshasim on same host).
# Reached via Nginx reverse proxy on 135.181.148.75.

services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: tedros
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env.production}
      POSTGRES_DB: tedros
      POSTGRES_INITDB_ARGS: "--locale=C.UTF-8 --encoding=UTF-8"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U tedros -d tedros"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    volumes:
      - redis_data:/data
    command: ["redis-server", "--save", "60", "1", "--loglevel", "warning"]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5

  tedros:
    build:
      context: .
      dockerfile: Dockerfile
    image: tedros:latest
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    env_file: .env.production
    ports:
      - "127.0.0.1:3001:3000"
    # Memory ceiling (TED-166). The host has 7.6 GB shared with other
    # projects; before this the container was unbounded, so 19 separate
    # heap-limit crashes each grew into the gigabytes first. 768 MB is ~4.6x
    # the app's measured 166 MB idle RSS, and sits ~70 MB above the ~700 MB
    # peak RSS the Dockerfile's --max-old-space-size=384 permits (see the
    # budget chain in the Dockerfile). That ordering is deliberate: V8 must
    # hit its own limit — which logs and exits so `unless-stopped` restarts —
    # before the cgroup SIGKILLs the process with no log at all.
    mem_limit: 768m
    mem_reservation: 256m
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://127.0.0.1:3000/healthz"]
      interval: 30s
      timeout: 5s
      start_period: 20s
      retries: 3

volumes:
  postgres_data:
  redis_data:
